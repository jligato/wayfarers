[pytest]
# Several modules in this suite do their work at IMPORT time (server/integration_script.py
# spawns a real uvicorn and drives it over HTTP). If such a module raises during
# import, pytest's default is to abort the whole session -- so one unbuildable or
# environment-blocked file prevented the other 800+ tests from running at all, and the
# run reported "Interrupted: 1 error during collection" with no real results.
# Continue past collection errors so a single bad file degrades to one reported error
# and the rest of the suite still executes.
#
# -rs prints the reason attached to every skipped test. The skip sites in
# server/tests/ already carry a reason (a missing database, a missing tool,
# an unlanded sibling edit), but a default run printed only the COUNT
# ("3 skipped"), so the text was invisible and a skip that quietly stopped
# covering a route looked identical to one that never covered it. -rs is a
# reporting flag only: it changes no pass/skip count and no test outcome.
addopts = --continue-on-collection-errors -rs

# Directory names pytest must never walk when collecting from the repo root.
# Listing any value here REPLACES pytest's built-in default list, so the
# defaults are repeated verbatim below before adding to them. Dropping them
# would let pytest descend into .git, build, dist, node_modules and venv.
#
# mutfull/ is a mirror copy of the source tree whose test files carry the SAME
# basenames as the real ones. Collected twice, each pair raises
# "import file mismatch": two different files claim one module name, and
# pytest errors out instead of collecting the test.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} mutfull _bak* *.bak lc_mutation mut_dc mutplug
